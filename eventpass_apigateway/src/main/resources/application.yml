spring:
  application:
    name: eventpass_apigateway
  cloud:
    gateway:
      server:
        webflux:
          enabled: true
          routes:
            - id: users-service
              uri: ${MS_USERS_URL:http://localhost:8084}
              predicates:
                - Path=/api/auth/**

            - id: events-service
              uri:
                ${MS_EVENTS_URL:http://localhost:8080}
              predicates:
                - Path=/api/events/**

            - id: orders-service
              uri:
                ${MS_ORDERS_URL:http://localhost:8081}
              predicates:
                - Path=/api/orders/**
            - id: payments-service

              uri:
                ${MS_PAYMENT_URL:http://localhost:8082}
              predicates:
                - Path=/api/payments/**

            - id: tickets-service
              uri:
                ${MS_TICKET_URL:http://localhost:8083}
              predicates:
                - Path=/api/tickets/**

server:
  port: 8085

secret:
  token:
    key: EventPass2026_Clave_super_secreta_para_firmar_el_jwt_987654321
