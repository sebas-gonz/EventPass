server:
  port: 8080

spring:
  application:
    name: eventpass-eventos
  main:
    web-application-type: reactive

  r2dbc:
    url: r2dbc:${DB_URL:postgresql://localhost:5432/events?currentSchema=events}
    username: ${DB_USER:postgres}
    password: ${DB_PWD:root}

  flyway:
    enabled: true
    url: jdbc:${DB_URL:postgresql://localhost:5432/events?currentSchema=events}
    user: ${DB_USER:postgres}
    password: ${DB_PWD:root}
    baseline-on-migrate: true
    default-schema: events

  output:
    ansi:
      enabled: always

secret:
  token:
    key: EventPass2026_Clave_super_secreta_para_firmar_el_jwt_987654321