spring:
    application:
        name: eventpass-orders
    main:
      web-application-type: reactive

    r2dbc:
      url: r2dbc:${DB_URL:postgresql://localhost:5432/order?currentSchema=orders}
      username: ${DB_USER:postgres}
      password: ${DB_PWD:root}

    flyway:
      enabled: true
      url: jdbc:${DB_URL:postgresql://localhost:5432/order}
      user: ${DB_USER:postgres}
      password: ${DB_PWD:root}
      baseline-on-migrate: true
      default-schema: orders

    output:
      ansi:
        enabled: always
server:
  port: 8081

secret:
  token:
    key: EventPass2026_Clave_super_secreta_para_firmar_el_jwt_987654321
