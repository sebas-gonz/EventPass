spring:
    application:
        name: eventpass-orders
    main:
      web-application-type: reactive

    r2dbc:
      url: r2dbc:${DB_URL:postgresql://localhost:5432/orders?currentSchema=orders }
      username: ${DB_USER:postgres}
      password: ${DB_PWD:root}

    flyway:
      enabled: true
      url: jdbc:${spring.r2dbc.url}
      user: ${spring.r2dbc.username}
      password: ${spring.r2dbc.password}
      baseline-on-migrate: true
      default-schema: orders

    output:
      ansi:
        enabled: always
server:
  port: 8081
